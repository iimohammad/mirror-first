name: nexus-mirror

# ---------------------------------------------------------------------------
# سرور میرور بر پایه Sonatype Nexus Repository
# روی یک VPS خارج از فیلتر (ترکیه / آلمان / هلند) بالا می‌آید.
# Nexus هیچ پورتی مستقیم پابلیک نمی‌کند؛ فقط از پشت nginx.
# ---------------------------------------------------------------------------

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nexus:
    # ⚠️ قبل از اجرا آخرین تگ پایدار را چک کن: hub.docker.com/r/sonatype/nexus3/tags
    #    3.70.1 آخرین نسخه‌ی خط OrientDB است و بدون تنظیم اضافه بالا می‌آید.
    #    از 3.71 به بعد دیتابیس H2/PostgreSQL است؛ NEXUS_DATASTORE_ENABLED را true بگذار.
    image: sonatype/nexus3:${NEXUS_VERSION:-3.70.1}
    restart: unless-stopped
    logging: *default-logging
    # این مقادیر برای سرور ۸ گیگ کالیبره شده‌اند (heap+direct=۵.۴ گیگ، به‌علاوه
    # metaspace/thread stack/سربار OS) — روی ۴ گیگ عملاً OOM می‌کند. روی سرور
    # کوچک‌تر، NEXUS_JVM_ARGS و NEXUS_MEM_LIMIT را در .env متناسب کم کن.
    mem_limit: ${NEXUS_MEM_LIMIT:-6g}
    environment:
      INSTALL4J_ADD_VM_PARAMS: >-
        ${NEXUS_JVM_ARGS:--Xms2703m -Xmx2703m -XX:MaxDirectMemorySize=2703m -Djava.util.prefs.userRoot=/nexus-data/javaprefs}
      # برای 3.71+ این خط را از کامنت دربیاور:
      # NEXUS_DATASTORE_ENABLED: "true"
    volumes:
      - nexus_data:/nexus-data
    networks: [mirror]
    # فقط روی لوپ‌بک همین سرور. از بیرون در دسترس نیست؛ اما provision.sh و
    # provision-hosted.sh (که REST API را صدا می‌زنند) به آن نیاز دارند و
    # می‌خواهیم از allowlist و TLS رد نشوند.
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/service/rest/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on: [nexus]
    ports:
      # پورت ۸۰ همیشه اینجا می‌ماند — چالش ACME از آن می‌آید و پروکسی SNI
      # اصلاً HTTP را پوشش نمی‌دهد.
      - "80:80"
      # وقتی پروکسی SNI روشن است، صاحب ۴۴۳ روی هاست اوست و این کانتینر فقط
      # از داخل شبکه‌ی داکر صدا زده می‌شود؛ آن‌وقت MIRROR_HTTPS_BIND را در
      # .env روی 127.0.0.1:8443 بگذار تا این دو روی یک پورت دعوا نکنند.
      - "${MIRROR_HTTPS_BIND:-0.0.0.0:443}:443"
    environment:
      MIRROR_DOMAIN: "${MIRROR_DOMAIN:?MIRROR_DOMAIN را در .env تنظیم کن}"
      # فقط متغیرهای MIRROR_* جایگزین شوند، وگرنه envsubst
      # متغیرهای خود nginx مثل $host و $remote_addr را هم می‌خورد
      NGINX_ENVSUBST_FILTER: "MIRROR_"

      # ─── کش جلوی نکسس (10-cache.conf + 92-cache.inc) ──────────────────
      # envsubst ایمیج nginx نحو ${VAR:-default} را نمی‌فهمد، پس پیش‌فرض‌ها
      # باید همین‌جا با interpolation خود compose ست شوند. اگر متغیری اینجا
      # تعریف نشود، در تمپلیت لفظی می‌ماند و nginx بالا نمی‌آید.
      MIRROR_CACHE_MAX_SIZE:   "${MIRROR_CACHE_MAX_SIZE:-20g}"
      MIRROR_CACHE_INACTIVE:   "${MIRROR_CACHE_INACTIVE:-30d}"
      MIRROR_CACHE_KEYS_ZONE:  "${MIRROR_CACHE_KEYS_ZONE:-64m}"
      MIRROR_IMMUTABLE_TTL:    "${MIRROR_IMMUTABLE_TTL:-365d}"
      MIRROR_NEGATIVE_TTL:     "${MIRROR_NEGATIVE_TTL:-1m}"
      MIRROR_DOCKER_TAG_TTL:   "${MIRROR_DOCKER_TAG_TTL:-1m}"
      MIRROR_DOCKER_PING_TTL:  "${MIRROR_DOCKER_PING_TTL:-5m}"

      # ─── سهمیه‌ی هر IP ─────────────────────────────────────────────────
      MIRROR_RATE_LIMIT:       "${MIRROR_RATE_LIMIT:-100r/s}"
      MIRROR_RATE_BURST:       "${MIRROR_RATE_BURST:-500}"
      MIRROR_CONN_LIMIT:       "${MIRROR_CONN_LIMIT:-200}"

      # ─── پنلِ باز ──────────────────────────────────────────────────────
      # 1 یعنی /panel از allowlist مستثنا شود (مخازن همچنان بسته می‌مانند).
      # برای وقتی که IP خودت ثابت نیست و مدام از پنل بیرون می‌افتی.
      MIRROR_PANEL_OPEN:       "${MIRROR_PANEL_OPEN:-0}"
      MIRROR_PANEL_LOGIN_RATE: "${MIRROR_PANEL_LOGIN_RATE:-20r/m}"
      MIRROR_PANEL_LOGIN_BURST: "${MIRROR_PANEL_LOGIN_BURST:-10}"

      # ─── وقتی پشت پروکسی SNI هستیم ─────────────────────────────────────
      # هر دو از یک متغیر (MIRROR_SNI) مشتق می‌شوند تا نشود یکی را ست کرد و
      # دیگری را نه. بدون این‌ها، ترافیکی که از sniproxy می‌آید $remote_addr
      # اش خودِ پروکسی است و acl.conf عملاً هیچ‌کس را فیلتر نمی‌کند.
      MIRROR_LISTEN_EXTRA: "${MIRROR_SNI:+proxy_protocol}"
      MIRROR_REALIP: "${MIRROR_SNI:+set_real_ip_from 172.16.0.0/12; real_ip_header proxy_protocol;}"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/acl.conf:/etc/nginx/conf.d/00-acl.conf:ro
      # حلقه‌ی reload تا گواهی تمدیدشده بدون restart دستی برداشته شود
      - ./nginx/docker-entrypoint.d/99-cert-reload.sh:/docker-entrypoint.d/99-cert-reload.sh:ro
      # همان، برای وقتی پنل از /panel/ips روی acl.conf می‌نویسد
      - ./nginx/docker-entrypoint.d/98-acl-reload.sh:/docker-entrypoint.d/98-acl-reload.sh:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot
      # کش آرتیفکت‌های تغییرناپذیر. عمداً /var/cache/mirror است نه
      # /var/cache/nginx: دایرکتوری کش را باید خود nginx بسازد تا مالکیتش
      # به یوزر worker برسد، و مسیرهای موقتِ خود ایمیج هم پوشانده نشوند.
      - nginx_cache:/var/cache/mirror
    networks: [mirror]

  # پروکسی passthrough بر پایه SNI — اختیاری، با پروفایل روشن می‌شود:
  #   COMPOSE_PROFILES=sni  و  MIRROR_HTTPS_BIND=127.0.0.1:8443  در .env
  #
  # کاری که میرور نمی‌تواند بکند را پوشش می‌دهد: git clone روی HTTPS، دانلود
  # از گیت‌هاب، و هر هاست HTTPS دیگری — بدون باز کردن TLS.
  sniproxy:
    profiles: ["sni"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "443:443"
    # DNS داخلی داکر (127.0.0.11) که در کانفیگ resolver شده، پرس‌وجوهای
    # غیرداخلی را به این‌ها فوروارد می‌کند. اگر DNS شبکه‌ی سرور خارج مشکل
    # دارد، این دو را در .env عوض کن.
    dns:
      - "${SNI_DNS1:-1.1.1.1}"
      - "${SNI_DNS2:-8.8.8.8}"
    environment:
      MIRROR_DOMAIN: "${MIRROR_DOMAIN:?MIRROR_DOMAIN را در .env تنظیم کن}"
      NGINX_ENVSUBST_FILTER: "MIRROR_"
      # خروجی envsubst باید خود nginx.conf باشد، نه conf.d — چون بلاک
      # stream در سطح main تعریف می‌شود.
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      # حلقه‌ی reload به‌جای acl.conf میرور، allowlist خود پروکسی را بپاید
      ACL_WATCH_FILE: /etc/nginx/sni-allow.conf
    volumes:
      - ./nginx/sni-templates:/etc/nginx/templates:ro
      - ./nginx/sni-allow.conf:/etc/nginx/sni-allow.conf:ro
      # همان حلقه‌ی reload، این‌بار روی allowlist خودِ پروکسی
      - ./nginx/docker-entrypoint.d/98-acl-reload.sh:/docker-entrypoint.d/98-acl-reload.sh:ro
    networks: [mirror]

  # پنل مدیریت (/panel/) — مدیریت allowlist آی‌پی و پکیج‌ها. پشت همان
  # nginx و همان allowlist است؛ لاگینش هم یوزر/پس ادمین Nexus را می‌خواهد،
  # پس دو لایه‌ی محافظت روی هم است.
  panel:
    build: ./panel
    restart: unless-stopped
    logging: *default-logging
    depends_on: [nexus]
    environment:
      NEXUS_URL: http://nexus:8081
      # عمداً :? نیست — یک ${VAR:?} در هر جای این فایل کل «docker compose
      # up» را می‌شکند، حتی وقتی فقط nginx/nexus را می‌خواهی بالا بیاوری و
      # اصلاً کاری به پنل نداری. اگر خالی بماند، خود کانتینر panel در
      # instrumentation.ts سریع و با پیام واضح fail می‌کند.
      PANEL_SESSION_SECRET: "${PANEL_SESSION_SECRET:-}"
      DATA_DIR: /data
      ACL_CONF_PATH: /shared/acl.conf
      SNI_ALLOW_PATH: /shared/sni-allow.conf
      NEXUS_DATA_PATH: /nexus-data
      NGINX_CACHE_PATH: /nginx-cache/cache
    volumes:
      - panel_data:/data
      # همان فایلی که nginx فقط-خواندنی مانتش کرده؛ پنل رویش می‌نویسد.
      - ./nginx/acl.conf:/shared/acl.conf
      # همان، برای allowlist پروکسی SNI — تا /panel/ips هر دو را با هم
      # مدیریت کند و لیست‌ها از هم واگرا نشوند.
      - ./nginx/sni-allow.conf:/shared/sni-allow.conf
      # فقط برای اندازه‌گیری مصرف دیسک (صفحه‌ی /disk) — read-only.
      - nexus_data:/nexus-data:ro
      - nginx_cache:/nginx-cache:ro
    networks: [mirror]

  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    entrypoint: >
      sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done'

networks:
  mirror:
    driver: bridge

volumes:
  nexus_data:
  panel_data:
  # کش nginx. جدا از nexus_data است، یعنی نسخه‌ی دومی از آرتیفکت‌های داغ روی
  # دیسک — موقع اندازه‌گیری فضا حسابش کن (MIRROR_CACHE_MAX_SIZE).
  nginx_cache:
